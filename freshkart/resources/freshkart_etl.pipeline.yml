# The main pipeline for freshkart

resources:
  pipelines:
    freshkart_etl:
      name: freshkart_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/freshkart_etl"

      libraries:
        - glob:
            include: ../src/freshkart_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
