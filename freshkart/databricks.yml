# This is a Declarative Automation Bundle definition for freshkart.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: freshkart
  uuid: 12006aa0-0382-4498-86a5-17c228436172

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-841ecea8-e2ed.cloud.databricks.com
    variables:
      catalog: fk_1393
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-841ecea8-e2ed.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bittuchoudhary2820@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/bittuchoudhary2820@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: fk_1393
      schema: prod
    permissions:
      - user_name: bittuchoudhary2820@gmail.com
        level: CAN_MANAGE
